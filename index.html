<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threeta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="speed"><span id="speed-value">0</span><small>km/h</small></div>
      <div id="help">
        <b>Car:</b> <b>W/S</b> gas / brake &nbsp; <b>A/D</b> steer &nbsp; <b>Space</b> handbrake<br />
        <b>On foot:</b> <b>WASD</b> move &nbsp; <b>Shift</b> run<br />
        <b>F</b> get in / out (or hijack) &nbsp; <b>R</b> reset &nbsp; <b>M</b> map<br />
        Crimes raise your wanted level &mdash; break line of sight to lose the cops
      </div>
      <div id="prompt"></div>
      <div id="wanted"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i><div class="evade"></div></div>
      <div id="banner"></div>
      <div id="map"><div class="frame"><canvas></canvas><div class="legend"><span class="you">You</span><span class="cop">Police</span><span class="car">Cars</span><span class="hint">M to close</span></div></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
