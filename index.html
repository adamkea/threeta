<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threeta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="speed"><span id="speed-value">0</span><small>km/h</small></div>
      <div id="help">
        <b>W / ↑</b> accelerate &nbsp; <b>S / ↓</b> brake / reverse<br />
        <b>A D / ← →</b> steer &nbsp; <b>Space</b> handbrake &nbsp; <b>R</b> reset
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
